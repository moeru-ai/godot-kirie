name: Publish npm Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  packages:
    name: Publish npm packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify release tag is on main
        if: github.event_name == 'push'
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "::error::Release tag ${GITHUB_REF_NAME} must point to a commit on main."
            exit 1
          fi

      - name: Install Node and pnpm
        uses: jdx/mise-action@v3
        with:
          install: true
          install_args: --locked node pnpm
          cache: true

      - name: Install pnpm dependencies
        run: mise x -- pnpm install --frozen-lockfile

      - name: Typecheck packages
        run: mise run typecheck

      - name: Build packages
        run: mise run build:packages

      - name: Dry-run publish npm packages
        run: mise x -- pnpm publish -r --access public --no-git-checks --dry-run

      - name: Publish npm packages
        if: github.event_name == 'push'
        run: mise x -- pnpm publish -r --access public --no-git-checks
