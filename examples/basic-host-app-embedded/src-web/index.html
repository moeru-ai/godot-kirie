<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- https://stackoverflow.com/a/59732654 -->
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0" />
    <title>Kirie embedded host</title>
    <link rel="stylesheet" href="/src/style.css" />
    <style>
      :root {
        color: #ecf8ff;
        font-family: ui-rounded, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      html,
      body {
        /*
         * https://stackoverflow.com/a/59732654
         */
        touch-action: manipulation;
        /*
         * https://stackoverflow.com/a/70836917
         */
        overscroll-behavior: none;
        /*
         * https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/Properties/-webkit-tap-highlight-color
         */
        -webkit-tap-highlight-color: transparent;
        width: 100%;
        height: 100%;
        background: transparent;
      }

      main {
        display: flex;
        justify-content: center;
      }

      .card {
        display: flex;
        flex-direction: column;
        gap: 8px;

        width: min(82vw, 420px);
        height: fit-content;

        margin-top: 48px;
        padding: 16px;

        border-radius: 16px;
        background: rgba(70, 74, 80, 0.88);
        box-shadow: 0 18px 60px rgb(0 0 0 / 45%);
        backdrop-filter: blur(18px);

        pointer-events: auto;
      }

      #status {
        color: #b9cbe2;
      }

      .card button {
        width: fit-content;

        border: none;
        border-radius: 12px;
        padding: 8px 16px;
        background: #2e8bb3;
        color: white;
        transition: transform 120ms ease, color 120ms ease;
        user-select: none;

        /*
         * https://stackoverflow.com/a/69295649
         */
        -webkit-user-select: none;
      }

      .card button:active {
        color: #ffffffbd;
        transform: scale(0.97);
      }

      .card pre {
        max-height: 150px;
        overflow: auto;
        color: #8fe6bc;
        font-size: 12px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card">
        <h1>WebView ↔ Godot</h1>

        <p id="status">Connecting Eventa…</p>

        <!-- ontouchstart must be registered and declared or otherwise :active won't work -->
        <!-- https://developer.apple.com/library/archive/documentation/AppleApplications/Reference/SafariWebContent/AdjustingtheTextSize/AdjustingtheTextSize.html -->
        <!-- https://bugs.webkit.org/show_bug.cgi?id=221366 -->
        <button id="invokeGodotButton" type="button" ontouchstart="">Invoke</button>

        <pre id="log">Web log:</pre>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
