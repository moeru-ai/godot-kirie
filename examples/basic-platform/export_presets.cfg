[preset.0]

name="macOS"
platform="macOS"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="src-web/dist/*,src-web/dist/**/*"
exclude_filter="node_modules/*,node_modules/**/*,src-web/index.html,src-web/src/*,src-web/src/**/*,src-web/node_modules/*,src-web/node_modules/**/*,src-web/package.json,src-web/tsconfig.json,src-web/vite.config.ts,package.json,tsconfig.json,kirie.config.ts,uno.config.ts"
export_path=""
patches=PackedStringArray()
patch_delta_encoding=false
patch_delta_compression_level_zstd=19
patch_delta_min_reduction=0.1
patch_delta_include_filters="*"
patch_delta_exclude_filters=""
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
binary_format/architecture="universal"
application/bundle_identifier="ai.moeru.kirie.examples.basic-platform"
codesign/codesign=3
codesign/identity="-"
codesign/entitlements/disable_library_validation=true
dotnet/include_scripts_content=false
dotnet/include_debug_symbols=true
dotnet/embed_build_outputs=false
kirie/debug/enable_web_inspector=false
kirie/debug/allow_tls_bypass=false
